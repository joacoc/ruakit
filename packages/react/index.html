<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rua · Component playground</title>
    <link rel="stylesheet" href="./results/demo/demo.css" />
    <style>
      .demo-page {
        margin: 0;
        background: #f7f6f9;
        color: #26232d;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color-scheme: light;
      }
      .demo-page #demo-root,
      .demo-page #demo-root * {
        box-sizing: border-box;
      }
      .demo-shell {
        max-width: 1080px;
        margin: 32px auto 64px;
        padding: 0 28px;
      }
      .demo-navigation {
        display: flex;
        gap: 6px;
        max-width: 1080px;
        margin: 28px auto 0;
        padding: 0 28px;
      }
      .demo-navigation a {
        padding: 8px 13px;
        border-radius: 9px;
        color: #77717f;
        font-size: 12px;
        text-decoration: none;
      }
      .demo-navigation a[aria-current="page"] {
        background: #ede7fa;
        color: #6d28d9;
        font-weight: 600;
      }
      .demo-navigation a:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }
      .demo-state-badge {
        padding: 4px 10px;
        border-radius: 7px;
        background: #f5f3f8;
        color: #7c3aed;
        font-size: 11px;
        text-transform: capitalize;
      }
      .demo-toolbar-preview {
        position: relative;
        min-height: 440px;
        transform: translateZ(0);
        background: radial-gradient(#e7e2ee 1px, transparent 1px) 0 0 / 18px
          18px;
      }
      .demo-toolbar-intro {
        padding: 48px 34px;
        text-align: center;
      }
      .demo-toolbar-preview[data-backdrop="gradient"] {
        background: linear-gradient(120deg, #7973f3, #c75fbf);
      }
      .demo-toolbar-preview[data-backdrop="gradient"] .demo-toolbar-intro {
        color: white;
      }
      .demo-toolbar-preview[data-backdrop="gradient"] .demo-toolbar-intro p,
      .demo-toolbar-preview[data-backdrop="gradient"] .demo-eyebrow {
        color: rgb(255 255 255 / 80%);
      }
      .demo-toolbar-intro h3 {
        margin: 12px 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .demo-toolbar-intro p {
        margin: 6px 0;
        color: #77717f;
        font-size: 13px;
      }
      .demo-last-answer {
        margin-top: 5px;
        color: #6d28d9;
        overflow-wrap: anywhere;
      }
      .demo-eyebrow {
        margin: 0 0 12px;
        color: #7c3aed;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.16em;
      }
      .demo-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
      }
      .demo-header h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.2;
        letter-spacing: -0.04em;
      }
      .demo-header p {
        margin: 12px 0 0;
        color: #77717f;
      }
      .demo-page button,
      .demo-page input,
      .demo-page select {
        font: inherit;
      }
      .demo-page button {
        cursor: pointer;
      }
      .demo-page button:focus-visible,
      .demo-page select:focus-visible,
      .demo-page input:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }
      .demo-reset {
        border: 1px solid #e3dfe8;
        border-radius: 9px;
        background: white;
        padding: 9px 14px;
        color: #68616f;
        white-space: nowrap;
      }
      .demo-layout {
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .demo-controls {
        display: grid;
        gap: 18px;
      }
      .demo-play {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        background: #7c3aed;
        color: white;
        font-weight: 650 !important;
        box-shadow: 0 4px 12px #7c3aed20;
      }
      .demo-play:hover {
        background: #6d28d9;
      }
      .demo-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .demo-action {
        padding: 13px 12px;
        text-align: left;
        border: 1px solid #e5e1eb;
        border-radius: 11px;
        background: white;
        color: #34303c;
      }
      .demo-action:hover,
      .demo-reset:hover {
        border-color: #c4b5fd;
        background: #fcfaff;
      }
      .demo-action span {
        display: block;
        margin-top: 3px;
        color: #8b8493;
        font-size: 11px;
      }
      .demo-speed {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #77717f;
        font-size: 13px;
      }
      .demo-speed select {
        min-width: 124px;
        padding: 8px;
        border: 1px solid #e3dfe8;
        border-radius: 8px;
        background: white;
        color: #34303c;
      }
      .demo-help {
        margin: 0;
        color: #918a99;
        font-size: 12px;
        line-height: 1.7;
      }
      .demo-stage {
        overflow: hidden;
        border: 1px solid #e5e1eb;
        border-radius: 18px;
        background: white;
        box-shadow: 0 8px 30px #21152f04;
      }
      .demo-stage-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 22px;
        border-bottom: 1px solid #f0edf4;
      }
      .demo-stage-header h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .demo-modes {
        display: flex;
        gap: 3px;
        padding: 3px;
        border-radius: 9px;
        background: #f5f3f8;
      }
      .demo-modes button {
        padding: 5px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #8b8493;
        font-size: 11px;
      }
      .demo-modes button[aria-pressed="true"] {
        background: white;
        color: #6d28d9;
        box-shadow: 0 1px 4px #21152f10;
      }
      .demo-sandbox {
        padding: 34px;
        background-image: radial-gradient(#e7e2ee 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .demo-form {
        padding: 26px;
        border: 1px solid #eae6ef;
        border-radius: 14px;
        background: white;
        box-shadow: 0 6px 18px #21152f05;
      }
      .demo-form h3 {
        margin: 0 0 20px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .demo-field {
        display: grid;
        gap: 7px;
        color: #77717f;
        font-size: 12px;
      }
      .demo-field input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ded9e6;
        border-radius: 8px;
        background: white;
        color: #34303c;
        font-size: 14px;
      }
      .demo-checkbox {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 18px 0 22px;
        color: #77717f;
        font-size: 13px;
      }
      .demo-checkbox input {
        width: 17px;
        height: 17px;
        margin: 0;
        accent-color: #7c3aed;
      }
      .demo-save {
        min-width: 144px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #302a3a;
        color: white;
        font-size: 13px !important;
      }
      .demo-track {
        display: grid;
        place-items: center;
        min-height: 112px;
        padding-top: 24px;
      }
      .demo-moving-target {
        width: 178px;
        padding: 14px;
        border: 1px dashed #cfc5dd;
        border-radius: 10px;
        background: #ffffffc9;
        color: #9a8ca9;
        font-size: 12px !important;
      }
      .demo-moving-target[data-moving="true"] {
        animation: demo-drift 2.8s ease-in-out infinite alternate;
      }
      .demo-status {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 54px;
        margin: 0;
        padding: 14px 22px;
        border-top: 1px solid #f0edf4;
        color: #8b8493;
        font-size: 12px;
      }
      .demo-status::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: #a78bfa;
      }
      .demo-page[data-demo-view="cursor"] .ruakit-cursor-highlight {
        display: none;
      }
      .demo-page[data-demo-view="highlight"] .ruakit-cursor-pointer {
        display: none;
      }
      @keyframes demo-drift {
        from {
          transform: translateX(-36px);
        }
        to {
          transform: translateX(36px);
        }
      }
      @media (max-width: 760px) {
        .demo-navigation {
          padding: 0 18px;
        }
        .demo-shell {
          margin: 30px auto;
          padding: 0 18px;
        }
        .demo-header {
          flex-wrap: wrap;
        }
        .demo-layout {
          grid-template-columns: 1fr;
        }
        .demo-stage {
          order: -1;
        }
        .demo-sandbox {
          padding: 22px;
        }
        .demo-form {
          padding: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .demo-moving-target[data-moving="true"] {
          animation: none;
        }
      }
    </style>
    <script defer src="./results/demo/demo.js"></script>
  </head>
  <body class="demo-page">
    <div id="demo-root">
      <p class="demo-shell">
        Build the preview with
        <code>pnpm --filter @ruakit/react demo:build</code>, then reload this
        page.
      </p>
    </div>
  </body>
</html>
